<html lang="pt-BR" class="scroll-smooth">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NotifyProX - Aplicativos de Notificações e Painéis Fakes</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet" />
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #000000 0%, #111111 100%);
    min-height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
  }
  /* Neon gradient text for logo in light green */
  .logo-text {
    background: linear-gradient(90deg, #7CFC00, #32CD32);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 700;
    font-size: 3.5rem;
    user-select: none;
    text-align: center;
    letter-spacing: 0.05em;
    text-shadow:
      0 0 5px #7CFC00,
      0 0 10px #7CFC00,
      0 0 20px #7CFC00,
      0 0 40px #32CD32,
      0 0 80px #32CD32;
  }
  /* Instagram fixed button top right in light green */
  .instagram-btn {
    position: fixed;
    top: 1rem;
    right: 1rem;
    background: #111111cc;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: box-shadow 0.3s ease, transform 0.3s ease;
    z-index: 50;
  }
  .instagram-btn svg {
    width: 24px;
    height: 24px;
    fill: #7CFC00;
    filter: drop-shadow(0 0 1px #7CFC00);
    transition: filter 0.3s ease;
  }
  .instagram-btn:hover {
    box-shadow:
      0 0 8px #7CFC00,
      0 0 16px #7CFC00,
      0 0 24px #7CFC00,
      0 0 32px #7CFC00;
    transform: scale(1.1);
  }
  .instagram-btn:hover svg {
    filter:
      drop-shadow(0 0 4px #7CFC00)
      drop-shadow(0 0 8px #7CFC00);
  }
  /* Buttons container */
  .btns-container {
    margin-top: 2.5rem;
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    flex-wrap: wrap;
    padding: 0 1rem;
  }
  /* Glassmorphism button style with green neon */
  .glass-btn {
    background: rgba(124 252 0 / 0.05);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 12px;
    border: 2px solid transparent;
    color: #7CFC00;
    font-weight: 700;
    font-size: 1.125rem;
    padding: 0.75rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    cursor: pointer;
    text-decoration: none;
    transition:
      transform 0.3s ease,
      border-color 0.3s ease,
      box-shadow 0.3s ease;
    user-select: none;
    min-width: 140px;
    justify-content: center;
  }
  .glass-btn svg {
    width: 24px;
    height: 24px;
    fill: #7CFC00;
    filter: drop-shadow(0 0 1px #7CFC00);
    flex-shrink: 0;
  }
  .glass-btn:hover {
    transform: scale(1.05);
    border-color: #7CFC00;
    box-shadow:
      0 0 8px #7CFC00,
      0 0 16px #7CFC00,
      0 0 24px #7CFC00;
  }
  /* Responsive font sizes */
  @media (max-width: 640px) {
    .logo-text {
      font-size: 2.5rem;
      margin-top: 1.5rem;
    }
    .btns-container {
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .glass-btn {
      font-size: 1rem;
      padding: 0.65rem 1.25rem;
      min-width: 120px;
    }
    .glass-btn svg {
      width: 20px;
      height: 20px;
    }
  }
  /* Footer */
  footer {
    margin-top: auto;
    padding: 1rem 0;
    text-align: center;
    font-size: 0.875rem;
    color: #4CAF50;
    user-select: none;
  }
</style>
</head>
<body>
  <!-- Instagram fixed button top right -->

      <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="#7CFC00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="5" width="18" height="12" rx="2" ry="2" stroke="#7CFC00" />
